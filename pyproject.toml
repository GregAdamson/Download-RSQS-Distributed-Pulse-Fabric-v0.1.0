[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsqs-distributed-pulse"
version = "0.10.0"
description = "Operational distributed reality intelligence fabric with trusted ingestion, evidence fusion, digital twins and governed action"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=43.0"
]

[project.scripts]
rsqs-fabricd = "rsqs_pulse.daemon:main"
