[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsqs-distributed-pulse"
version = "0.11.0"
description = "Distributed reality intelligence machine with stable callable identities and signed federated intelligence exports"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=43.0"
]

[project.scripts]
rsqs-fabricd = "rsqs_pulse.daemon:main"
