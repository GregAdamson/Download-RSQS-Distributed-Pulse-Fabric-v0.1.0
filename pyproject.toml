[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsqs-distributed-pulse"
version = "0.6.0"
description = "Distributed state, cognition, causal learning and authorised action fabric"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=43.0"
]

[project.scripts]
rsqs-fabricd = "rsqs_pulse.daemon:main"
