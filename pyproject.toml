[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsqs-distributed-pulse"
version = "0.9.0"
description = "Operational deterministic distributed fabric with trust, resilience, bounded strategy search and target-agnostic adapters"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=43.0"
]

[project.scripts]
rsqs-fabricd = "rsqs_pulse.daemon:main"
