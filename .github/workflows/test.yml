name: test

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m pip install -e .
      - name: Run v0.1 demo
        run: python3 scripts/demo.py
      - name: Run v0.2 demo
        run: python3 scripts/demo_v02.py
      - name: Run HTTP transport demo
        run: python3 scripts/http_transport_demo.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
